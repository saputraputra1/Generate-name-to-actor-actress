<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebrity Similarity — 10.000 Famous</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #ffd700;
            --light: #ffffff;
            --dark: #0a0a0a;
            --gray: #f5f5f5;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--gray);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--light);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 500;
            color: var(--primary);
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: var(--light);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #283593;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background-color: var(--secondary);
            color: var(--dark);
        }

        .secondary-btn:hover {
            background-color: #ffc400;
        }

        .results-container {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .celebrity-card {
            background-color: var(--light);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .celebrity-card:hover {
            transform: translateY(-5px);
        }

        .celebrity-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 3px solid var(--secondary);
        }

        .celebrity-details {
            padding: 15px;
        }

        .celebrity-name {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .celebrity-profession {
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .celebrity-country {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .similarity-score {
            display: inline-block;
            background-color: var(--primary);
            color: var(--light);
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .no-results {
            text-align: center;
            color: var(--primary);
            font-weight: 500;
            padding: 20px;
            display: none;
        }

        .error-message {
            color: #d32f2f;
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
            display: none;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

        // Generate a random celebrity dataset
        function generateCelebrityDataset() {
            const dataset = [];

                const firstName = seedNames.male[Math.floor(Math.random() * seedNames.male.length)];

                    gender: "male",

            // Generate female celebrities (40%)

                const firstName = seedNames.female[Math.floor(Math.random() * seedNames.female.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                
                dataset.push({
                    name: `${firstName} ${lastName}`,
                    gender: "female",
                    profession: professions.female[Math.floor(Math.random() * professions.female.length)],
                    country: countries[Math.floor(Math.random() * countries.length)],
                    image: Math.random() > 0.7 ? `https://i.pravatar.cc/300?img=${Math.floor(Math.random() * 70) + 70}` : fallbackAvatar
                });
            }
            
            // Shuffle the dataset
            return dataset.sort(() => Math.random() - 0.5);
        }

        // Levenshtein distance algorithm for string similarity
        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            
            const matrix = [];
            
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, // substitution
                            matrix[i][j - 1] + 1,     // insertion
                            matrix[i - 1][j] + 1      // deletion
                        );
                    }
                }
            }
            
            return matrix[b.length][a.length];
        }

        // Calculate similarity score between two names
        function calculateSimilarity(inputName, celebrityName) {
            // Convert to lowercase for case-insensitive comparison
            const input = inputName.toLowerCase();
            const celebrity = celebrityName.toLowerCase();
            
            // Calculate Levenshtein distance
            const distance = levenshteinDistance(input, celebrity);
            const maxLength = Math.max(input.length, celebrity.length);
            let similarity = (1 - distance / maxLength) * 100;
            
            // Apply random weighted boost (between 0.8 and 1.2)
            const randomBoost = 0.8 + Math.random() * 0.4;
            similarity *= randomBoost;
            
            // Bonus if first names match
            const inputFirstName = input.split(' ')[0];
            const celebrityFirstName = celebrity.split(' ')[0];
            if (inputFirstName === celebrityFirstName) {
                similarity += 15;
            }
            
            // Cap the similarity between 70-100% if names are very different
            if (similarity > 100) similarity = 100;
            if (similarity < 0) similarity = 0;
            
            // Ensure minimum 5% and maximum 100%
            return Math.min(100, Math.max(5, Math.round(similarity)));
        }

        // Filter and find similar celebrities
        function findSimilarCelebrities(inputName, genderFilter, dataset) {
            // Filter by gender first
            let filteredDataset = dataset;
            if (genderFilter !== 'all') {
                filteredDataset = dataset.filter(celebrity => celebrity.gender === genderFilter);
            }
            
            // Calculate similarity scores for each celebrity
            const celebritiesWithScores = filteredDataset.map(celebrity => {
                const similarity = calculateSimilarity(inputName, celebrity.name);
                return {
                    ...celebrity,
                    similarity
                };
            });
            
            // Sort by similarity score (descending)
            celebritiesWithScores.sort((a, b) => b.similarity - a.similarity);
            
            // Return top 3
            return celebritiesWithScores.slice(0, 3);
        }

        // Display results

            if (results.length === 0) {

                noResults.style.display = 'block';
                return;
            }

                        <span class="similarity-score">${celebrity.similarity}% similar</span>
                    </div>
                `;
                
                resultsGrid.appendChild(card);
            });
            
            resultsContainer.style.display = 'block';
        }

            });

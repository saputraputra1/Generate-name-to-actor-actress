<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Jodoh Nama</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cari Jodoh Nama</h1>
            <p class="subtitle">Temukan jodoh berdasarkan nama Anda dari 3.400 orang terkenal</p>
        </header>

        <div class="search-form">
            <div class="form-group">
                <label for="name">Nama Lengkap Anda</label>
                <input type="text" id="name" placeholder="Contoh: Budi Santoso" required>
            </div>
            
            <div class="form-group">
                <label for="gender">Jenis Kelamin Anda</label>
                <select id="gender">
                    <option value="male">Pria</option>
                    <option value="female">Wanita</option>
                </select>
            </div>
            
            <button id="search-btn">Cari Jodoh Nama</button>
            <p class="error-message" id="error-message">Silakan masukkan nama Anda</p>
        </div>

        <div class="results-container" id="results-container">
            <h2 class="results-title">Jodoh Anda Ditemukan!</h2>
            <div class="results-grid" id="results-grid">
                <!-- Hasil akan ditampilkan di sini oleh JavaScript -->
            </div>
        </div>

        <div class="no-results" id="no-results">
            Maaf, tidak ada jodoh yang cocok ditemukan. Coba lagi!
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
